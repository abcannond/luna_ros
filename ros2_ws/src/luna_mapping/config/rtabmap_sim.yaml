# RTAB-Map parameters for Lunabotics (sim + hardware)
# Optimized for accurate occupancy grid generation and reliable visual SLAM

/**:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"

    subscribe_depth: true
    subscribe_rgb: true
    subscribe_rgbd: false
    subscribe_scan: false
    subscribe_scan_cloud: false
    subscribe_odom_info: false

    approx_sync: true
    sync_queue_size: 10

    # QoS (2 = Best Effort for Gazebo bridge)
    qos_image: 2
    qos_camera_info: 2
    qos_odom: 2

    database_path: ""

    # --- SLAM core ---
    Rtabmap/DetectionRate: "2.0"
    Rtabmap/TimeThr: "0.0"
    Rtabmap/MemoryThr: "0"

    # Memory
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Mem/STMSize: "30"

    # Feature detection (ORB is fast and works well for textured lunar terrain)
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1500"
    Vis/MinInliers: "15"
    Vis/CorType: "0"

    # Registration (visual registration for loop closures)
    Reg/Strategy: "0"
    Reg/Force3DoF: "true"

    # Odometry
    Odom/Strategy: "0"
    Odom/ResetCountdown: "0"
    Odom/GuessMotion: "true"

    # --- Occupancy grid ---
    Grid/FromDepth: "true"
    Grid/RayTracing: "true"
    Grid/3D: "false"
    Grid/CellSize: "0.05"
    Grid/RangeMax: "5.0"
    Grid/RangeMin: "0.5"

    # Ground segmentation using surface normals (much more accurate than height-only)
    Grid/NormalsSegmentation: "true"
    Grid/MaxGroundAngle: "30"
    Grid/MaxGroundHeight: "0.15"
    Grid/MaxObstacleHeight: "2.0"
    Grid/FlatObstacleDetected: "false"

    # Robot footprint for grid clearing under the robot
    Grid/FootprintLength: "0.65"
    Grid/FootprintWidth: "0.53"
    Grid/FootprintHeight: "0.40"

    # Clustering (small enough to catch individual rocks)
    Grid/MinClusterSize: "10"
    Grid/ClusterRadius: "0.1"

    # Noise filtering
    Grid/NoiseFilteringRadius: "0.1"
    Grid/NoiseFilteringMinNeighbors: "5"
    Grid/DepthDecimation: "4"

    # Optimizer
    Optimizer/Strategy: "1"
    Optimizer/Iterations: "20"

    # Loop closure and proximity
    RGBD/NeighborLinkRefining: "true"
    RGBD/AngularUpdate: "0.1"
    RGBD/LinearUpdate: "0.1"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityByTime: "false"
    RGBD/ProximityMaxGraphDepth: "0"
