# Single file for twist_mux (do not split topics/locks — second YAML can overwrite params).
twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      navigation:
        topic   : /cmd_vel_navigation
        timeout : 1.0
        priority: 10
      teleop:
        topic   : /cmd_vel_teleop
        timeout : 0.5
        priority: 100
