# teleop_nav_gate: Start (default Xbox btn 7) arms teleop; Back (6) returns to Nav2.
# Deactivate order is reverse of this list; activate uses this order.
teleop_nav_gate:
  ros__parameters:
    start_button: 7
    back_button: 6
    teleop_cmd_vel_in: "/teleop_cmd_vel_raw"
    cmd_vel_out: "/cmd_vel"
    teleop_active_out: "/teleop_active"
    nav2_lifecycle_nodes:
      # Full Nav2 navigation lifecycle set (plus manager) so Start can fully shut Nav2 down.
      # Order matters: deactivate/shutdown is applied in reverse order by teleop_nav_gate.
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - smoother_server
      - velocity_smoother
    # Root kill-switch: Nav2 lifecycle manager service.
    nav2_manager: "/lifecycle_manager_navigation/manage_nodes"
