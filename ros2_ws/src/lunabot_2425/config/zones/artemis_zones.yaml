# Artemis Arena (KSC) zone definitions (Gazebo world frame = map frame)
#
# Robot spawn: x=-2.750, y=-1.750, yaw=pi/2 (facing +Y)
# Fiducial tags near (-2.5, -2.65) and (-3.6, -1.75)
#
# Bounds are [x_min, x_max, y_min, y_max] in meters.
# Adjust after visual verification in Gazebo / RViz.
#
# Reference: 2025 Lunabotics Guidebook, Sections 3.1, 5.4, 5.5
# https://fsi.ucf.edu/wp-content/uploads/sites/4/2025/01/lunaboticsguidebook-2025-1.pdf

frame_id: map

zones:
  starting_zone:
    bounds: [-4.0, -1.5, -3.0, -0.5]
    color: [0.0, 1.0, 0.0, 0.25]
    description: "Robot start position and fiducial localization area"

  obstacle_field:
    bounds: [-1.5, 1.5, -3.0, 3.0]
    color: [1.0, 0.5, 0.0, 0.25]
    description: "Rocks and craters between start and construction sides"

  excavation_zone:
    bounds: [1.5, 4.0, -3.0, 0.0]
    color: [0.6, 0.3, 0.0, 0.25]
    description: "Regolith excavation area"

  construction_zone:
    bounds: [1.5, 4.0, 0.0, 3.0]
    color: [0.0, 0.5, 1.0, 0.25]
    description: "Berm construction target area"

waypoints:
  excavation_entry: [0.5, -1.0, 0.0]
  construction_entry: [2.5, 1.5, 1.57]
  return_to_start: [-2.5, -1.5, 1.57]
