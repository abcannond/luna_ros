---
# Core ROS plumbing
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# TF (dynamic transforms: odom→base_link, moving joints)
- ros_topic_name: "/tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Simulated lidar scan (if exists in Gazebo; /scan is reserved for depth-to-laserscan)
# Uncomment if you have a lidar sensor and want to use it alongside depth scan
#- ros_topic_name: "/scan_lidar"
#  gz_topic_name: "scan"
#  ros_type_name: "sensor_msgs/msg/LaserScan"
#  gz_type_name: "gz.msgs.LaserScan"
#  direction: GZ_TO_ROS

# State estimation / odometry
- ros_topic_name: "/odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Nav2 velocity commands to robot base
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"

# Joint states for robot_state_publisher TF
- ros_topic_name: "/joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"
# RGB Camera (RealSense D455 format: /camera/camera/...)
- ros_topic_name: "/camera/camera/color/image_raw"
  gz_topic_name: "/sim/camera/rgb/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera/color/camera_info"
  gz_topic_name: "/sim/camera/rgb/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth Camera (rectified depth image)
- ros_topic_name: "/camera/camera/depth/image_rect_raw"
  gz_topic_name: "/sim/camera/depth/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera/depth/camera_info"
  gz_topic_name: "/sim/camera/depth/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Point cloud aligned to color (from depth camera)
- ros_topic_name: "/camera/camera/depth/color/points"
  gz_topic_name: "/sim/camera/depth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

