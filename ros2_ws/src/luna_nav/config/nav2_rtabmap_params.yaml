# Nav2 parameters for RTAB-Map integration
# Static map only: RTAB-Map occupancy grid for both costmaps (no live depth/laserscan)

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    # Allow costmap to be up to 3 s stale so controller doesn't abort when depth/costmap lag
    costmap_update_timeout: 3.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Relaxed so slow / careful motion doesn't trigger abort (robot may pause to avoid obstacles)
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      # Slower max speed so robot can react and stop before hitting obstacles (no collisions)
      min_vel_x: -0.2
      max_vel_x: 0.32
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.32
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      # Allow TF lag so controller doesn't fail when map→odom is briefly stale
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Safety first; then prefer facing direction of travel when safe
      BaseObstacle.scale: 0.12
      # Prioritize facing the direction we're going when it's safe to turn
      PathAlign.scale: 56.0
      GoalAlign.scale: 36.0
      RotateToGoal.scale: 48.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Safety margin: treat robot as larger so planner keeps more clearance (no collisions)
      robot_radius: 0.45
      # Tolerate TF timing mismatches (map→odom can lag when turning; avoid dropping costmap updates)
      transform_tolerance: 1.0
      # Static map + point cloud (voxel): live depth adds cost for rocks in view; point cloud uses filtered depth (ground crop) to limit trail
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 2  # Require 2+ points in voxel to mark (reduces single-point noise / phantom obstacles)
        observation_sources: depth_cloud
        depth_cloud:
          topic: /camera/camera/depth/color/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.03
          clearing: true
          marking: true
          data_type: "PointCloud2"
          # Limit range so far (noisy) depth doesn't create patchy/wrong cost; perspective more consistent
          raytrace_max_range: 3.0
          raytrace_min_range: 0.4
          obstacle_max_range: 2.5
          obstacle_min_range: 0.4
          observation_persistence: 0.35
          # Max period (s) between depth updates before warning; depth/RTAB-Map can lag to 2–3 s, so 3 s avoids spam
          expected_update_rate: 3.0
          observation_source_delay: 0.1
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Reduced by ~3 cells (0.15 m at 0.05 m/cell) so cost spreads less from obstacles
        inflation_radius: 0.40
      
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 1.0  # map→odom can lag when turning
      plugins: ["static_layer", "inflation_layer"]
      
      # Static layer from RTAB-Map occupancy grid (no live obstacle layers)
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # Reduced by ~3 cells (0.15 m) so cost spreads less from obstacles
        inflation_radius: 0.27
      
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.32, 0.0, 0.8]
    min_velocity: [-0.32, 0.0, -0.8]
    max_accel: [2.0, 0.0, 3.2]
    max_decel: [-2.0, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
