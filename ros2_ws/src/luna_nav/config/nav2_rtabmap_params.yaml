# Nav2 parameters for RTAB-Map integration (Lunabotics competition)
# Merged: main costmap/static-layer improvements + holonomic DWB (bounded strafe) for
# quadruplex swerve (LunaController uses linear.y). Global inflation tuned for more direct routes.
# See docs/STACK_GUIDE.md (Swerve / steering) for caps and steering safety notes.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 3.0
    min_x_velocity_threshold: 0.001
    # Low threshold so small strafe (holonomic) is not treated as "stopped"
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 25.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.28
      yaw_goal_tolerance: 0.32
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Holonomic swerve: allow bounded lateral velocity (Nav2 must match LunaController).
      min_vel_x: -0.12
      max_vel_x: 0.20
      min_vel_y: -0.10
      max_vel_y: 0.10
      max_vel_theta: 0.55
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 1.2
      acc_lim_y: 0.8
      acc_lim_theta: 2.0
      decel_lim_x: -1.4
      decel_lim_y: -0.8
      decel_lim_theta: -2.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 2.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.28
      # Below max_vel_x / max_speed_xy so DWB does not stall in RotateToGoal
      trans_stopped_velocity: 0.04
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.60
      BaseObstacle.sum_scores: false
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 36.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 26.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# LOCAL COSTMAP — static map + voxel (depth) + scan + inflation
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.38
      transform_tolerance: 1.0
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 2
        observation_sources: depth_cloud crater_cloud
        depth_cloud:
          topic: /camera/camera/depth/color/points_ground_filtered
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.35
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30
          observation_persistence: 0.1
          expected_update_rate: 0.0
          inf_is_valid: true
        crater_cloud:
          topic: /craters/points
          max_obstacle_height: 0.5
          min_obstacle_height: -0.1
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          observation_persistence: 8.0
          expected_update_rate: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.62

      always_send_full_costmap: true

# GLOBAL COSTMAP — RTAB-Map grid; tighter inflation than 1.0 m for more direct NavFn routes
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.2
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.38
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 1.0
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.6
        inflation_radius: 0.80

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 12.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 2.0

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [vx, vy, wz] — align vy cap with DWB max_vel_y
    max_velocity: [0.22, 0.10, 0.65]
    min_velocity: [-0.18, -0.10, -0.65]
    max_accel: [1.2, 0.8, 2.0]
    max_decel: [-1.4, -0.8, -2.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
