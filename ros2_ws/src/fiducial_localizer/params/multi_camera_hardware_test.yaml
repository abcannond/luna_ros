# Hardware smoke-test params: any DICT_4X4_50 marker (id=-1 = accept all), 3 fiducial
# cameras (front_left, front_right, back_left). Used by hardware_smoke.launch.py.
#
# To change which 3 cameras are active, edit the three lists below in lockstep
# (same order, same length) and the corresponding device paths in the launch file.

multi_camera_marker_localizer:
  ros__parameters:
    image_topics:
      - /fid_cams/front_left_camera/image_raw
      - /fid_cams/front_right_camera/image_raw
      - /fid_cams/back_left_camera/image_raw
    camera_info_topics:
      - /fid_cams/front_left_camera/camera_info
      - /fid_cams/front_right_camera/camera_info
      - /fid_cams/back_left_camera/camera_info
    camera_frames:
      - front_left_camera_link_optical
      - front_right_camera_link_optical
      - back_left_camera_link_optical

    aruco_dict: "DICT_4X4_50"
    marker_id: -1
    marker_size_m: 0.50
    world_frame: "map"
    robot_frame: "base_link"

    # For a smoke test, leave the marker at the map origin: published
    # /fiducial_pose then equals the robot's pose relative to the marker.
    world_to_marker_xyz: [0.0, 0.0, 0.0]
    world_to_marker_yaw: 0.0

    # Disable embedded multi-marker mode (single tag for the test).
    outer_marker_ids: [-1]
    inner_marker_ids: [-1]
    active_marker_group: -1

    # Loose covariance — we are not feeding an EKF in this test, just sanity
    # checking that a pose comes out.
    position_stddev: 0.05
    yaw_stddev: 0.02
    range_scale_per_m: 0.05

    # Accept the tag out to ~3 m (50 cm tag is detectable well past that, but
    # PnP gets noisy at long range without good intrinsics).
    max_marker_distance_m: 3.0

    # Publish quickly — no need for the long sim startup gate.
    startup_stability_seconds: 1.0
    startup_stable_xy_thresh_m: 0.05
    startup_stable_yaw_thresh_rad: 0.10
    startup_stable_required_frames: 2
