# Fiducial localizer sim (4 wheel-pod cams). Topics/frames match gz_bridge and robot.urdf.xacro.
# UCF: aruco_marker_0 DICT_5X5_1000 ID 256 (0.88 m plane) at (-4.75, 2.75, 1.0) in world/map.

multi_camera_marker_localizer:
  ros__parameters:
    image_topics:
      - /fid_cams/front_left_camera/image_raw
      - /fid_cams/front_right_camera/image_raw
      - /fid_cams/back_left_camera/image_raw
      - /fid_cams/back_right_camera/image_raw
    camera_info_topics:
      - /fid_cams/front_left_camera/camera_info
      - /fid_cams/front_right_camera/camera_info
      - /fid_cams/back_left_camera/camera_info
      - /fid_cams/back_right_camera/camera_info
    camera_frames:
      - front_left_camera_link_optical
      - front_right_camera_link_optical
      - back_left_camera_link_optical
      - back_right_camera_link_optical
    aruco_dict: "DICT_5X5_1000"
    embedded_mode: true
    marker_id_large: 256
    marker_id_small: 395
    marker_size_large_m: 0.88
    marker_size_small_m: 0.126
    marker_id: -1
    marker_size_m: 0.16
    world_frame: "map"
    robot_frame: "base_link"
    marker_child_frame: "aruco"
    world_to_marker_xyz: [-4.75, 2.75, 1.0]
    world_to_marker_yaw: 1.5708
    camera_optical_extra_yaw_rad: 0.0
    pose_smooth_window: 1
    camera_extrinsic_offset_m: 0.0
    camera_extrinsic_offset_phase_rad: 0.0
