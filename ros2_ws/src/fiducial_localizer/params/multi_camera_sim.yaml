# Fiducial localizer sim parameters (4 wheel-pod cameras).
# Topics/frames match gz_bridge and robot.urdf.xacro.
#
# ArUco marker positions must match the SDF world files:
#   UCF:     aruco_marker_0 at (-4.75, 2.75, 1.0), rotated to face +X
#   Artemis: TODO -- add ArUco marker model to artemis_arena.sdf

multi_camera_marker_localizer:
  ros__parameters:
    image_topics:
      - /fid_cams/front_left_camera/image_raw
      - /fid_cams/front_right_camera/image_raw
      - /fid_cams/back_left_camera/image_raw
      - /fid_cams/back_right_camera/image_raw
    camera_info_topics:
      - /fid_cams/front_left_camera/camera_info
      - /fid_cams/front_right_camera/camera_info
      - /fid_cams/back_left_camera/camera_info
      - /fid_cams/back_right_camera/camera_info
    camera_frames:
      - front_left_camera_link_optical
      - front_right_camera_link_optical
      - back_left_camera_link_optical
      - back_right_camera_link_optical
    aruco_dict: "DICT_4X4_50"
    marker_id: -1
    marker_size_m: 0.16
    world_frame: "map"
    robot_frame: "base_link"
    world_to_marker_xyz: [-4.75, 2.75, 1.0]
    world_to_marker_yaw: 1.5708
    republish_map_odom_rate_hz: 10.0
    max_map_odom_translation_jump_m: 0.5
    max_map_odom_rotation_jump_rad: 0.5
    publish_debug_images: false
    status_marker_topic: /fiducial_status
    status_marker_rate_hz: 2.0
