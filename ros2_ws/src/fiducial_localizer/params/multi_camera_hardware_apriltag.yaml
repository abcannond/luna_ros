# Hardware fiducial preset: AprilTag 36h11, 4 fiducial cameras.
# Sister file to multi_camera_hardware.yaml (DICT_4X4_50). Pick whichever matches
# the printed tags in the arena via the localizer_params launch arg on
# hardware_bringup.launch.py.
#
# marker_id: -1 accepts any ID in the dictionary. Override marker_size_m,
# aruco_dict, or marker_id from the launch line as needed.

multi_camera_marker_localizer:
  ros__parameters:
    image_topics:
      - /fid_cams/front_left_camera/image_raw
      - /fid_cams/front_right_camera/image_raw
      - /fid_cams/back_left_camera/image_raw
      - /fid_cams/back_right_camera/image_raw
    camera_info_topics:
      - /fid_cams/front_left_camera/camera_info
      - /fid_cams/front_right_camera/camera_info
      - /fid_cams/back_left_camera/camera_info
      - /fid_cams/back_right_camera/camera_info
    camera_frames:
      - front_left_camera_link_optical
      - front_right_camera_link_optical
      - back_left_camera_link_optical
      - back_right_camera_link_optical

    aruco_dict: "DICT_APRILTAG_36h11"
    marker_id: -1
    marker_size_m: 0.17
    world_frame: "map"
    robot_frame: "base_link"

    # Marker pinned at the map origin: /fiducial_pose then equals the robot's
    # pose relative to the marker. Override for a real arena layout.
    world_to_marker_xyz: [0.0, 0.0, 0.0]
    world_to_marker_yaw: 0.0

    # Embedded multi-marker mode disabled (single tag).
    outer_marker_ids: [-1]
    inner_marker_ids: [-1]
    active_marker_group: -1

    position_stddev: 0.05
    yaw_stddev: 0.02
    range_scale_per_m: 0.05

    max_marker_distance_m: 3.0

    startup_stability_seconds: 1.0
    startup_stable_xy_thresh_m: 0.05
    startup_stable_yaw_thresh_rad: 0.10
    startup_stable_required_frames: 2
